name: launcher_icon_switcher
description: A Flutter plugin that allows you to switch your app launcher icon or check the currently set one.
version: 0.0.2
homepage: https://github.com/artcodefun/launcher_icon_switcher
issue_tracker: https://github.com/artcodefun/launcher_icon_switcher/issues

environment:
  sdk: '>=3.1.5 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.launcher_icon_switcher
        pluginClass: LauncherIconSwitcherPlugin
      ios:
        pluginClass: LauncherIconSwitcherPlugin
